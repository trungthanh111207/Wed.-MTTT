<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng Mã Chứng Khoán</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #e1e7ef;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container.grid {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .container.grid {
                grid-template-columns: 3fr 2fr;
            }
        }

        .card {
            background-color: #151a23;
            border: 1px solid #232a36;
            border-radius: 12px;
            padding: 20px;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #94a3b8;
            border-bottom: 1px solid #232a36;
            padding-bottom: 8px;
        }

        /* Video styling */
        .video-card video {
            width: 100%;
            border-radius: 8px;
            background-color: #000;
            aspect-ratio: 16 / 9;
        }

        /* Stock list & simulation styling */
        .stock-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #1e2633;
        }

        .stock-item:last-child {
            border-bottom: none;
        }

        .symbol {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .price {
            font-family: monospace;
            font-size: 1.05rem;
        }

        .up { color: #22c55e; }
        .down { color: #ef4444; }

        .guide-list {
            padding-left: 20px;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .guide-list li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<main class="container grid">
    <!-- Cột bên trái: Video mô phỏng -->
    <section class="card video-card">
        <h2>Video mô phỏng</h2>
        <video controls playsinline preload="metadata" aria-label="MÔ PHỎNG BIẾN ĐỘNG GIÁ CỦA MỘT MÃ CHỨNG KHOÁN">
            <source src="{{ url_for('static', path='/video/Thành.mp4') }}" type="video/mp4">
            Trình duyệt của bạn không hỗ trợ video HTML5.
        </video>
    </section>

    <!-- Cột bên phải: Mô phỏng mã chứng khoán & Hướng dẫn -->
    <aside class="card">
        <h2>Bảng giá mô phỏng</h2>
        <div id="stock-board">
            <div class="stock-item">
                <div>
                    <div class="symbol">FPT</div>
                    <small style="color: #64748b;">Tập đoàn FPT</small>
                </div>
                <div class="price up">128.50 ▲ +1.5%</div>
            </div>
            <div class="stock-item">
                <div>
                    <div class="symbol">VIC</div>
                    <small style="color: #8b646400;">Vingroup</small>
                </div>
                <div class="price down">45.20 ▼ -0.8%</div>
            </div>
            <div class="stock-item">
                <div>
                    <div class="symbol">HPG</div>
                    <small style="color: #8a8b64f0;">Hòa Phát</small>
                </div>
                <div class="price up">28.90 ▲ +2.1%</div>
            </div>
        </div>

        <h2 style="margin-top: 25px;">Cách quan sát</h2>
        <ol class="guide-list">
            <li>So sánh các kích thước mẫu n.</li>
            <li>Quan sát histogram của trung bình mẫu.</li>
            <li>Đánh giá xu hướng tiến về dạng chuông.</li>
        </ol>
    </aside>
</main>

</body>
</html>
