<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng Mã Chứng Khoán</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #e1e7ef;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .main-wrapper {
            max-width: 900px;
            width: 100%;
        }

        /* Header thông tin trường & STT */
        .header-info {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #151a23;
            border: 1px solid #232a36;
            border-radius: 12px;
        }

        .header-info h1 {
            font-size: 1.2rem;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .header-info .stt {
            font-size: 1rem;
            font-weight: 600;
            color: #f59e0b;
        }

        .card {
            background-color: #151a23;
            border: 1px solid #232a36;
            border-radius: 12px;
            padding: 20px;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #94a3b8;
            border-bottom: 1px solid #232a36;
            padding-bottom: 8px;
        }

        /* Video styling */
        .video-card video {
            width: 100%;
            border-radius: 8px;
            background-color: #000;
            aspect-ratio: 16 / 9;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- Header thông tin trường và STT -->
    <header class="header-info">
        <h1>TRƯỜNG ĐẠI HỌC SƯ PHẠM - ĐẠI HỌC ĐÀ NẴNG</h1>
        <div class="stt">STT: 33</div>
    </header>

    <main>
        <!-- Chỉ giữ lại Video mô phỏng -->
        <section class="card video-card">
            <h2>Video mô phỏng</h2>
            <video controls playsinline preload="metadata" aria-label="MÔ PHỎNG BIẾN ĐỘNG GIÁ CỦA MỘT MÃ CHỨNG KHOÁN">
                <source src="{{ url_for('static', path='/video/Thành.mp4') }}" type="video/mp4">
                Trình duyệt của bạn không hỗ trợ video HTML5.
            </video>
        </section>
    </main>
</div>

</body>
</html>
